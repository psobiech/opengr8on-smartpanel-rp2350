# Prebuilt firmware for the Waveshare RP2350-Touch-LCD-4 (smartpanel.uf2, plus .elf/.bin), built
# with the Pico SDK version the project is developed on (README, "Budowanie"), and the host tests
# (test/host). Two variants: with screen blanking (PANEL_DISPLAY_BLANK=ON, the default) and without
# it (-noblank: the sleeping display stays dimmed). Tag v*: GitHub release with both .uf2 images.
name: Firmware

on:
  push:
    branches: [ "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PICO_SDK_VERSION: 2.2.0

jobs:
  firmware:
    name: Firmware (RP2350-Touch-LCD-4, ${{ matrix.variant.label }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        variant:
          - { name: opengr8on-smartpanel-rp2350, blank: "ON", label: "screen blanking" }
          - { name: opengr8on-smartpanel-rp2350-noblank, blank: "OFF", label: "no screen blanking" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe for VERSION

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            build-essential python3 git

      - name: Cache Pico SDK
        id: pico-sdk-cache
        uses: actions/cache@v6
        with:
          path: ~/pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-tinyusb-${{ runner.os }}

      - name: Fetch Pico SDK
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk ~/pico-sdk
          git -C ~/pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Build
        run: |
          cmake -G Ninja -B build -DPICO_SDK_PATH="$HOME/pico-sdk" -DCMAKE_BUILD_TYPE=Release \
            -DPANEL_DISPLAY_BLANK=${{ matrix.variant.blank }}
          cmake --build build

      - name: Package
        run: |
          set -euo pipefail
          out="dist/${{ matrix.variant.name }}"
          mkdir -p "$out"
          cp build/smartpanel.uf2 build/smartpanel.elf build/smartpanel.bin "$out/"
          git describe --tags --always --dirty > "$out/VERSION"
          ls -l "$out"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant.name }}
          path: dist/${{ matrix.variant.name }}
          if-no-files-found: error

  host-tests:
    name: Host tests
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # external/clu-esp32: TF-Bus frame parser used by the tests

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev make

      # ASan's shadow memory does not fit with the runners' default 32-bit mmap randomisation.
      - name: Allow AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Tests
        run: make -C test/host test

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ firmware ]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: opengr8on-smartpanel-rp2350*
          path: firmware # one directory per variant (artifact name)

      # opengr8on-smartpanel-rp2350-<tag>.uf2 / .zip, and -<tag>-noblank for the variant without blanking
      - name: Assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p assets
          for variant_dir in firmware/*/; do
            variant="$(basename "$variant_dir")"
            suffix="${variant#opengr8on-smartpanel-rp2350}"
            cp "$variant_dir/smartpanel.uf2" "assets/opengr8on-smartpanel-rp2350-${tag}${suffix}.uf2"
            (cd "$variant_dir" && zip -qr "$GITHUB_WORKSPACE/assets/opengr8on-smartpanel-rp2350-${tag}${suffix}.zip" .)
          done
          ls -l assets

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
